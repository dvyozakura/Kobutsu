name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Write public URL into share pages
        run: sed -i "s#__PAGES_URL__#${{ steps.pages.outputs.base_url }}#g" share/*.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
